<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>House Flip Pro Forma (Standalone)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
      .icon { width:1.25rem; height:1.25rem; display:inline-block; vertical-align:middle; }
    </style>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // Simple localStorage-based shim for window.storage used in TSX
      const storage = {
        prefix: 'project:',
        async list(prefix) {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!prefix || k.startsWith(prefix)) keys.push(k);
          }
          return { keys };
        },
        async get(key) {
          const v = localStorage.getItem(key);
          return { value: v };
        },
        async set(key, value) {
          localStorage.setItem(key, value);
          return { ok: true };
        },
        async remove(key) {
          localStorage.removeItem(key);
          return { ok: true };
        }
      };

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        }).format(value);
      };

      const formatPercent = (value) => {
        return value.toFixed(1) + '%';
      };

      const HouseFlipProFormaStandalone = () => {
        const [inputs, setInputs] = useState({
          projectName: 'Terrace Way',
          purchasePrice: 432910,
          arvPrice: 600000,
          holdPeriodWeeks: 36,
          purchaseClosingCosts: 4329,
          saleClosingCostsPct: 6,
          propertyTaxesAnnual: 4500,
          insuranceAnnual: 4500,
          utilitiesMonthly: 200,
          hoaMonthly: 0,
          contingencyPct: 10
        });

        const [renovationItems, setRenovationItems] = useState([
          {
            id: 1,
            category: 'Flooring',
            materials: [
              { name: 'Tiles', cost: 3500 },
              { name: 'Underlayment', cost: 800 }
            ],
            labor: 5300,
            notes: '1,200 sq ft'
          },
          {
            id: 2,
            category: 'Paint',
            materials: [
              { name: 'Interior Paint', cost: 2800 },
              { name: 'Primer', cost: 600 }
            ],
            labor: 4200,
            notes: 'Entire interior'
          },
          {
            id: 3,
            category: 'Kitchen',
            materials: [
              { name: 'Cabinets', cost: 6500 },
              { name: 'Countertops', cost: 3200 }
            ],
            labor: 1700,
            notes: 'Full remodel'
          },
          {
            id: 4,
            category: 'Bathroom',
            materials: [
              { name: 'Vanity', cost: 1200 },
              { name: 'Toilet', cost: 400 }
            ],
            labor: 800,
            notes: '2 bathrooms'
          }
        ]);

        const [financingSources, setFinancingSources] = useState([
          {
            id: 1,
            name: 'Senior Mortgage',
            type: 'ltv',
            ltvPct: 75,
            fixedAmount: 0,
            interestRate: 7.5,
            originationPct: 1,
            enabled: true
          },
          {
            id: 2,
            name: 'Hard Money',
            type: 'fixed',
            ltvPct: 0,
            fixedAmount: 40000,
            interestRate: 12,
            originationPct: 2,
            enabled: true
          }
        ]);

        const [activeTab, setActiveTab] = useState('dashboard');
        const [activeRenovationTab, setActiveRenovationTab] = useState('summary');
        const [savedProjects, setSavedProjects] = useState([]);
        const [currentProjectId, setCurrentProjectId] = useState(null);

        // Load saved projects using shim
        useEffect(() => {
          const load = async () => {
            try {
              const res = await storage.list('project:');
              if (res && res.keys) {
                const projects = [];
                for (const k of res.keys) {
                  try {
                    const data = await storage.get(k);
                    if (data && data.value) {
                      projects.push(JSON.parse(data.value));
                    }
                  } catch(e){ /* ignore */ }
                }
                setSavedProjects(projects);
              }
            } catch(e) { /* ignore */ }
          };
          load();
        }, []);

        const calculations = useMemo(() => {
          const calc = (inputSet, renovItems, finSources) => {
            const baseRenovation = renovItems.reduce((sum, item) => {
              const materialsTotal = item.materials.reduce((s, m) => s + (m.cost||0), 0);
              return sum + materialsTotal + (item.labor||0);
            }, 0);

            const contingency = baseRenovation * (inputSet.contingencyPct / 100);
            const totalRenovation = baseRenovation + contingency;

            const holdMonths = inputSet.holdPeriodWeeks / 4.33;
            const propertyTaxes = (inputSet.propertyTaxesAnnual / 12) * holdMonths;
            const insurance = (inputSet.insuranceAnnual / 12) * holdMonths;
            const utilities = inputSet.utilitiesMonthly * holdMonths;
            const hoa = inputSet.hoaMonthly * holdMonths;
            const totalHoldingCosts = propertyTaxes + insurance + utilities + hoa;

            const financingDetails = finSources.filter(s => s.enabled).map(source => {
              let loanAmount = 0;
              if (source.type === 'ltv') {
                loanAmount = inputSet.purchasePrice * (source.ltvPct / 100);
              } else {
                loanAmount = source.fixedAmount;
              }
              const origination = loanAmount * (source.originationPct / 100);
              const interest = loanAmount * (source.interestRate / 100) * (holdMonths / 12);
              return { name: source.name, loanAmount, origination, interest, total: origination + interest };
            });

            const totalLoanAmount = financingDetails.reduce((sum, f) => sum + f.loanAmount, 0);
            const totalFinancingCosts = financingDetails.reduce((sum, f) => sum + f.total, 0);

            const totalCosts = inputSet.purchasePrice + inputSet.purchaseClosingCosts + totalRenovation + totalHoldingCosts + totalFinancingCosts;

            const saleClosingCosts = inputSet.arvPrice * (inputSet.saleClosingCostsPct / 100);
            const netSaleProceeds = inputSet.arvPrice - saleClosingCosts;
            const netProfit = netSaleProceeds - totalCosts;
            const totalEquity = totalCosts - totalLoanAmount;
            const roi = totalEquity ? (netProfit / totalEquity) * 100 : 0;
            const years = holdMonths / 12 || 1;
            const irr = years > 0 ? ((Math.pow(1 + (roi / 100), 1 / years) - 1) * 100) : 0;

            return { totalRenovation, baseRenovation, contingency, totalHoldingCosts, financingDetails, totalLoanAmount, totalFinancingCosts, totalCosts, netSaleProceeds, saleClosingCosts, netProfit, totalEquity, roi, irr, holdMonths };
          };

          return { base: calc(inputs, renovationItems, financingSources) };
        }, [inputs, renovationItems, financingSources]);

        const updateInput = (field, value) => {
          setInputs(prev => ({ ...prev, [field]: parseFloat(value) || 0 }));
        };

        const updateFinancingSource = (id, field, value) => {
          setFinancingSources(prev => prev.map(source => {
            if (source.id === id) {
              if (field === 'enabled') return { ...source, enabled: value };
              if (field === 'name') return { ...source, name: value };
              if (field === 'type') return { ...source, type: value };
              return { ...source, [field]: parseFloat(value) || 0 };
            }
            return source;
          }));
        };

        const addFinancingSource = () => {
          const newId = Math.max(...financingSources.map(f => f.id), 0) + 1;
          setFinancingSources(prev => [...prev, { id: newId, name: 'New Financing', type: 'fixed', ltvPct: 0, fixedAmount: 0, interestRate: 8, originationPct: 1, enabled: true }]);
        };

        const updateRenovationItem = (id, field, subfield, value) => {
          setRenovationItems(prev => prev.map(item => {
            if (item.id === id) {
              if (field === 'materials') {
                return { ...item, materials: item.materials.map((m, idx) => idx === subfield ? { ...m, cost: parseFloat(value) || 0 } : m) };
              } else if (field === 'materialName') {
                return { ...item, materials: item.materials.map((m, idx) => idx === subfield ? { ...m, name: value } : m) };
              } else if (field === 'labor') {
                return { ...item, labor: parseFloat(value) || 0 };
              } else if (field === 'notes') {
                return { ...item, notes: value };
              }
            }
            return item;
          }));
        };

        const addMaterialToItem = (itemId) => {
          setRenovationItems(prev => prev.map(item => item.id === itemId ? { ...item, materials: [...item.materials, { name: 'New Material', cost: 0 }] } : item));
        };

        const removeMaterialFromItem = (itemId, materialIdx) => {
          setRenovationItems(prev => prev.map(item => item.id === itemId && item.materials.length > 1 ? { ...item, materials: item.materials.filter((_, idx) => idx !== materialIdx) } : item));
        };

        // Add/Remove renovation categories
        const addRenovationItem = () => {
          const newId = Math.max(...renovationItems.map(r => r.id), 0) + 1;
          const newItem = { id: newId, category: 'New Category', materials: [{ name: 'New Material', cost: 0 }], labor: 0, notes: '' };
          setRenovationItems(prev => [...prev, newItem]);
          setActiveRenovationTab(newId);
        };

        const removeRenovationItem = (itemId) => {
          setRenovationItems(prev => prev.filter(item => item.id !== itemId));
          if (activeRenovationTab === itemId) setActiveRenovationTab('summary');
        };

        // Save / Load projects (using storage shim)
        const saveProject = async () => {
          const id = inputs.projectName.replace(/\s+/g, '-').toLowerCase() + '-' + Date.now();
          const payload = { inputs, renovationItems, financingSources, id, name: inputs.projectName };
          await storage.set('project:' + id, JSON.stringify(payload));
          setSavedProjects(prev => [...prev, payload]);
          alert('Saved project to localStorage: ' + id);
        };

        const loadProject = async (id) => {
          try {
            const res = await storage.get('project:' + id);
            if (res && res.value) {
              const p = JSON.parse(res.value);
              setInputs(p.inputs || inputs);
              setRenovationItems(p.renovationItems || renovationItems);
              setFinancingSources(p.financingSources || financingSources);
              setCurrentProjectId(id);
            }
          } catch(e){ console.log(e); }
        };

        return (
          <div className="min-h-screen p-4">
            <div className="max-w-7xl mx-auto">
              <div className="bg-white rounded-lg shadow p-6 mb-4 flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-bold">{inputs.projectName}</h1>
                  <div className="text-sm text-gray-600">Enhanced House Flip Pro Forma (standalone)</div>
                </div>
                <div className="space-x-2">
                  <button className="px-3 py-1 bg-blue-600 text-white rounded" onClick={() => setActiveTab('dashboard')}>Dashboard</button>
                  <button className="px-3 py-1 bg-gray-200 rounded" onClick={() => setActiveTab('inputs')}>Inputs</button>
                  <button className="px-3 py-1 bg-gray-200 rounded" onClick={() => setActiveTab('renovation')}>Renovation</button>
                  <button className="px-3 py-1 bg-gray-200 rounded" onClick={() => setActiveTab('financing')}>Financing</button>
                </div>
              </div>

              {activeTab === 'dashboard' && (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                  <div className="bg-white rounded-lg p-4 shadow">
                    <div className="text-sm text-gray-600">Net Profit</div>
                    <div className="text-xl font-bold">{formatCurrency(calculations.base.netProfit)}</div>
                    <div className="text-sm text-gray-500">{formatPercent(calculations.base.roi)} ROI</div>
                  </div>
                  <div className="bg-white rounded-lg p-4 shadow">
                    <div className="text-sm text-gray-600">IRR</div>
                    <div className="text-xl font-bold">{formatPercent(calculations.base.irr)}</div>
                  </div>
                  <div className="bg-white rounded-lg p-4 shadow">
                    <div className="text-sm text-gray-600">Equity Required</div>
                    <div className="text-xl font-bold">{formatCurrency(calculations.base.totalEquity)}</div>
                  </div>
                </div>
              )}

              {activeTab === 'inputs' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                  <div className="bg-white rounded-lg p-4 shadow">
                    <h3 className="font-semibold mb-2">Property Details</h3>
                    <div className="space-y-2">
                      <div>
                        <label className="text-sm">Project Name</label>
                        <input className="w-full border px-2 py-1" value={inputs.projectName} onChange={(e)=>setInputs(prev=>({...prev, projectName: e.target.value}))} />
                      </div>
                      <div>
                        <label className="text-sm">Purchase Price</label>
                        <input className="w-full border px-2 py-1" type="number" value={inputs.purchasePrice} onChange={(e)=>updateInput('purchasePrice', e.target.value)} />
                      </div>
                      <div>
                        <label className="text-sm">ARV</label>
                        <input className="w-full border px-2 py-1" type="number" value={inputs.arvPrice} onChange={(e)=>updateInput('arvPrice', e.target.value)} />
                      </div>
                      <div>
                        <label className="text-sm">Hold Period (weeks)</label>
                        <input className="w-full border px-2 py-1" type="number" value={inputs.holdPeriodWeeks} onChange={(e)=>updateInput('holdPeriodWeeks', e.target.value)} />
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-lg p-4 shadow">
                    <h3 className="font-semibold mb-2">Holding Costs</h3>
                    <div className="space-y-2">
                      <div>
                        <label className="text-sm">Property Taxes (annual)</label>
                        <input className="w-full border px-2 py-1" type="number" value={inputs.propertyTaxesAnnual} onChange={(e)=>updateInput('propertyTaxesAnnual', e.target.value)} />
                      </div>
                      <div>
                        <label className="text-sm">Insurance (annual)</label>
                        <input className="w-full border px-2 py-1" type="number" value={inputs.insuranceAnnual} onChange={(e)=>updateInput('insuranceAnnual', e.target.value)} />
                      </div>
                      <div>
                        <label className="text-sm">Utilities (monthly)</label>
                        <input className="w-full border px-2 py-1" type="number" value={inputs.utilitiesMonthly} onChange={(e)=>updateInput('utilitiesMonthly', e.target.value)} />
                      </div>
                    </div>
                    <div className="mt-3 flex justify-between">
                      <button className="px-3 py-1 bg-green-600 text-white rounded" onClick={saveProject}>Save Project</button>
                      <select className="border px-2 py-1" onChange={(e)=>loadProject(e.target.value)}>
                        <option value="">Load saved project...</option>
                        {savedProjects.map(p => <option key={p.id} value={p.id}>{p.name || p.id}</option>)}
                      </select>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'renovation' && (
                <div className="mb-4">
                  <div className="bg-white rounded-lg p-4 shadow mb-3 flex gap-2">
                    <button className={'px-3 py-1 rounded ' + (activeRenovationTab==='summary'?'bg-blue-600 text-white':'bg-gray-200')} onClick={()=>setActiveRenovationTab('summary')}>Summary</button>
                    {renovationItems.map(item=>(
                      <button key={item.id} className={'px-3 py-1 rounded ' + (activeRenovationTab===item.id?'bg-blue-600 text-white':'bg-gray-200')} onClick={()=>setActiveRenovationTab(item.id)}>{item.category}</button>
                    ))}
                    <button className="ml-auto px-3 py-1 bg-green-600 text-white rounded" onClick={addRenovationItem}>Add Category</button>
                  </div>

                  {activeRenovationTab === 'summary' && (
                    <div className="bg-white p-4 rounded shadow mb-3">
                      <h3 className="font-semibold mb-2">Renovation Budget Summary</h3>
                      <table className="w-full text-sm">
                        <thead className="bg-gray-100"><tr><th>Category</th><th className="text-right">Materials</th><th className="text-right">Labor</th><th className="text-right">Total</th></tr></thead>
                        <tbody>
                          {renovationItems.map(item => {
                            const materialsTotal = item.materials.reduce((s,m)=>s+(m.cost||0),0);
                            const itemTotal = materialsTotal + (item.labor||0);
                            return <tr key={item.id} className="border-t"><td>{item.category}</td><td className="text-right">{formatCurrency(materialsTotal)}</td><td className="text-right">{formatCurrency(item.labor)}</td><td className="text-right font-bold">{formatCurrency(itemTotal)}</td></tr>;
                          })}
                          <tr className="bg-blue-50 font-bold"><td colSpan="3">Total</td><td className="text-right">{formatCurrency(calculations.base.totalRenovation)}</td></tr>
                        </tbody>
                      </table>
                    </div>
                  )}

                  {renovationItems.map(item => activeRenovationTab === item.id && (
                    <div key={item.id} className="bg-white p-4 rounded shadow mb-3">
                      <div className="flex items-center justify-between mb-3">
                        <h4 className="font-semibold">{item.category} - Details</h4>
                        <div>
                          <button className="px-2 py-1 bg-red-500 text-white rounded" onClick={()=>removeRenovationItem(item.id)}>Remove Category</button>
                        </div>
                      </div>

                      <div className="mb-3">
                        <div className="flex items-center justify-between mb-2">
                          <div className="font-medium">Materials</div>
                          <button className="px-2 py-1 bg-green-600 text-white rounded" onClick={()=>addMaterialToItem(item.id)}>Add Material</button>
                        </div>
                        <div className="space-y-2">
                          {item.materials.map((mat, idx) => (
                            <div key={idx} className="flex gap-2 items-center">
                              <input className="flex-1 border px-2 py-1" value={mat.name} onChange={(e)=>updateRenovationItem(item.id,'materialName',idx,e.target.value)} />
                              <input className="w-32 border px-2 py-1" type="number" value={mat.cost} onChange={(e)=>updateRenovationItem(item.id,'materials',idx,e.target.value)} />
                              {item.materials.length > 1 && <button className="text-red-600" onClick={()=>removeMaterialFromItem(item.id, idx)}>Delete</button>}
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="mb-3">
                        <div className="font-medium mb-1">Labor</div>
                        <input className="w-full border px-2 py-1" type="number" value={item.labor} onChange={(e)=>updateRenovationItem(item.id,'labor',null,e.target.value)} />
                      </div>

                      <div className="bg-blue-50 p-3 rounded">
                        <div className="text-sm text-gray-600">Total</div>
                        <div className="text-2xl font-bold">{formatCurrency(item.materials.reduce((s,m)=>s+(m.cost||0),0) + (item.labor||0))}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {activeTab === 'financing' && (
                <div className="bg-white p-4 rounded shadow mb-4">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="font-semibold">Financing Sources</h3>
                    <button className="px-2 py-1 bg-green-600 text-white rounded" onClick={addFinancingSource}>Add Source</button>
                  </div>

                  <div className="space-y-3">
                    {financingSources.map(src => (
                      <div key={src.id} className={'p-3 border rounded ' + (src.enabled ? 'bg-blue-50' : 'bg-gray-50')}>
                        <div className="flex items-center gap-2 mb-2">
                          <input type="checkbox" checked={src.enabled} onChange={(e)=>updateFinancingSource(src.id,'enabled', e.target.checked)} />
                          <input className="font-semibold border-b px-1 bg-transparent" value={src.name} onChange={(e)=>updateFinancingSource(src.id,'name', e.target.value)} />
                        </div>

                        {src.enabled && (
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
                            <div>
                              <label className="block text-xs">Type</label>
                              <select className="w-full border px-1 py-1" value={src.type} onChange={(e)=>updateFinancingSource(src.id,'type', e.target.value)}>
                                <option value="ltv">LTV %</option>
                                <option value="fixed">Fixed</option>
                              </select>
                            </div>

                            {src.type === 'ltv' ? (
                              <div>
                                <label className="block text-xs">LTV %</label>
                                <input className="w-full border px-1 py-1" type="number" value={src.ltvPct} onChange={(e)=>updateFinancingSource(src.id,'ltvPct', e.target.value)} />
                              </div>
                            ) : (
                              <div>
                                <label className="block text-xs">Amount</label>
                                <input className="w-full border px-1 py-1" type="number" value={src.fixedAmount} onChange={(e)=>updateFinancingSource(src.id,'fixedAmount', e.target.value)} />
                              </div>
                            )}

                            <div>
                              <label className="block text-xs">Interest %</label>
                              <input className="w-full border px-1 py-1" type="number" step="0.1" value={src.interestRate} onChange={(e)=>updateFinancingSource(src.id,'interestRate', e.target.value)} />
                            </div>

                            <div>
                              <label className="block text-xs">Origination %</label>
                              <input className="w-full border px-1 py-1" type="number" step="0.1" value={src.originationPct} onChange={(e)=>updateFinancingSource(src.id,'originationPct', e.target.value)} />
                            </div>
                          </div>
                        )}

                        {src.enabled && (
                          <div className="mt-2 text-xs grid grid-cols-3 gap-2">
                            <div>Loan: <span className="font-semibold">{formatCurrency(calculations.base.financingDetails.find(f=>f.name===src.name)?.loanAmount||0)}</span></div>
                            <div>Interest: <span className="font-semibold">{formatCurrency(calculations.base.financingDetails.find(f=>f.name===src.name)?.interest||0)}</span></div>
                            <div>Total Cost: <span className="font-semibold">{formatCurrency(calculations.base.financingDetails.find(f=>f.name===src.name)?.total||0)}</span></div>
                          </div>
                        )}
                      </div>
                    ))}

                    <div className="bg-blue-50 p-3 rounded grid grid-cols-2 gap-4">
                      <div>
                        <div className="text-sm text-gray-600">Total Loans</div>
                        <div className="font-bold">{formatCurrency(calculations.base.totalLoanAmount)}</div>
                      </div>
                      <div>
                        <div className="text-sm text-gray-600">Total Financing Costs</div>
                        <div className="font-bold">{formatCurrency(calculations.base.totalFinancingCosts)}</div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <footer className="text-center text-sm text-gray-500 mt-6">
                Enhanced House Flip Pro Forma — standalone
              </footer>
            </div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<HouseFlipProFormaStandalone />);
    </script>
  </body>
</html>
